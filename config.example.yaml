# BaoZiCode 配置文件示例
# 复制本文件为 config.yaml，然后填入你的偏好

# 当前使用的后端：anthropic | openai | minimax | deepseek
backend: anthropic
# v0.3 当前版本

# 全局系统提示（每个 backend 共用，v0.3 沿用；v0.4 由 PromptBuilder 拼装 11 个 sections）
system_prompt: "You are BaoZiCode, a helpful AI coding assistant."

# v0.4 用户追加指令 — 喂给 PromptBuilder 的 custom section,默认空
# 多行示例(用 | 或 > 都行):
# custom_instructions: |
#   始终用中文回复。
#   改完代码记得跑 pytest 确认没有回归。
#
# custom_instructions: ""

# v0.4 skills 目录 — PromptBuilder 启动时扫描本目录,把每个 SKILL.md 注入 system prompt
# 目录不存在/为空时静默跳过,不报错
# skills_dir: ~/.config/baozicode/skills

# v0.4 长效记忆文件 — 类似 AGENTS.md,PromptBuilder 启动时整个文件读入 system prompt
# 文件不存在时静默跳过,不报错
# ⚠️ memory_path 在 v0.8 已 deprecated,v0.9 移除。请改用下面的 memory.user_dir + memory.project_dir 双层目录。
# 兼容行为:如果 memory_path 指向的文件存在 + 新双层目录都空,会自动 fallback 把单文件当 user 级索引读,
# 启动 banner 打印一行 WARN 提示用户迁移。
# memory_path: ~/.config/baozicode/memory.md

# v0.8 长效记忆(双层) — 自动 LLM 笔记抽取
#
# 双层物理隔离:
# - user_dir:    跟人走,所有项目共享
# - project_dir: 跟项目走,只在本项目生效
# 每条笔记一个独立 .md 文件(带 YAML frontmatter),另有一份 MEMORY.md 索引,
# 启动时索引灌进 system prompt 顶部 `## 长期记忆 (用户级/项目级)` 段。
#
# 笔记 4 类 + 自动路由:
# - user-pref   → user_dir
# - correction  → user_dir
# - project     → project_dir
# - reference   → project_dir
#
# 索引硬上限: 200 行 / 25 KB(MEMORY.md)
# 触达 warn 阈值的下限: 180 行 / 22 KB
# 每次 LLM 笔记提取输入近 5 轮对话
# 单会话内允许自动压缩次数: 1(连续触发 → HUMAN_NEEDED 状态,提示用户人工)
#
# 关掉 memory(退回 v0.7 行为):
# memory:
#   enabled: false
#
# memory:
#   enabled: true
#   user_dir: ~/.config/baozicode/memory          # 跟人走
#   project_dir: .baozicode/memory                 # 跟项目走(默认已 gitignore)
#   index_max_lines: 200                           # MEMORY.md 行数硬上限(ge=50)
#   index_max_bytes: 25600                         # MEMORY.md 字节硬上限(ge=1024)
#   warning_lines: 180                             # WARN 阈值(必须 < max_lines)
#   warning_bytes: 22528                           # WARN 阈值(必须 < max_bytes)
#   recent_turns_for_update: 5                     # 每次 LLM 抽取输入近 N 轮
#   auto_compress_per_session: 1                   # 单会话内自动压缩次数上限

# v0.8 会话存档(JSONL 追加写) — 退出不丢,重启可续
#
# 每条 message 追加写到 <dir>/<YYYYMMDD-HHMMSS-xxxx>.jsonl
# (中间加 flush + fsync 防止崩溃丢数据)。
# 启动时跑 cleanup_expired 删除 retention_days 之前的 JSONL + 对应 context 目录。
# /resume 列已有 sessions 弹选择器;--resume <id> 直接续;--new 强制开新。
#
# 关掉 sessions(退回 v0.7 行为,每次启动都是新 session):
# sessions:
#   enabled: false
#
# sessions:
#   enabled: true
#   dir: .baozicode/sessions                       # JSONL 文件目录(相对路径 → 拼到 project_root)
#   retention_days: 30                             # 过期清理阈值(ge=1)

# v0.9 — slash 命令参数(目前只有 review_prompt 一个字段)
#
# /review 在 PROMPT 类型命令里把预设文本送 Agent。模板含 {since} 占位符,
# 运行时被 /review <since> 的 args 替换;无 args 时默认替换为 "本次会话开始"。
# 为 null 时用 baozicode/commands/builtin.py 默认文本:
#   "请审查当前会话自 {since} 以来的所有改动(patch、命令输出、对话)。\n
#    输出三段:## 摘要 / ## 风险点 / ## 建议修复。"
#
# commands:
#   review_prompt: "自定义 {since} 模板 ...\n## 段落 ##"

# 注意：四个后端的配置块全部必填。
# 即使当前用 anthropic，也要填好 minimax / deepseek 两块（key 和 model）。
# 这样切换后端只需改 `backend:` 一行，config 不会"半缺失"。

# Anthropic 后端配置
anthropic:
  # API Key 通过环境变量加载，YAML 里用 ${VAR_NAME} 占位
  api_key: ${ANTHROPIC_API_KEY}
  model: claude-sonnet-4-6
  # base_url 可选，默认 https://api.anthropic.com
  # base_url: https://api.anthropic.com

# OpenAI 后端配置
openai:
  api_key: ${OPENAI_API_KEY}
  model: gpt-5
  # base_url 可选，默认 https://api.openai.com/v1
  # base_url: https://api.openai.com/v1

# MiniMax 后端配置（项目方自研模型，OpenAI 兼容）
# ⚠️ DEFAULT_BASE_URL 是占位猜测值，请按 MiniMax 官方文档改成正确地址
minimax:
  api_key: ${MINIMAX_API_KEY}
  model: MiniMax-M3
  # base_url 可选，默认 https://api.minimaxi.com/v1（占位）
  # base_url: https://your-actual-minimax-endpoint/v1

# DeepSeek 后端配置（OpenAI 兼容）
deepseek:
  api_key: ${DEEPSEEK_API_KEY}
  model: deepseek-chat
  # base_url 可选，默认 https://api.deepseek.com/v1
  # base_url: https://api.deepseek.com/v1

# 工具调用权限控制（v0.2 新增；整个块可省略，省略时全用默认）
#
# auto_allow：列出的工具名跳过高风险确认 Modal（仍执行，仍记录卡片）
#   典型用途：把 Grep/Glob 这类只读工具加进去，减少弹窗
# deny：列出的工具名/glob 永远拒绝（命中即 is_error，不弹 Modal）
#   典型用途：临时禁掉危险工具，无需改代码
# batch_confirm：高风险工具连续同类型 ≥2 次时，第一次 Modal 提供 "Allow all remaining"
#   默认 false —— 单 Modal 确认是主线，避免误操作
# bash_locked_cwd：true 时 Bash 不跟随 cd，永远在 project_root 执行
#   默认 false —— 跟随 cd 是日常场景；锁住适合 CI/批量任务
#
# permissions:
#   auto_allow:
#     - Grep
#     - Glob
#   deny:
#     - "Bash:*sudo*"
#   batch_confirm: true
#   bash_locked_cwd: false

# Agent 主循环配置（v0.3 新增，v0.4 扩展；整个块可省略，省略时全用默认）
#
# max_iterations：Agent 单次 run 的最大迭代轮次（兜底安全网）
#   默认 20 —— 足以应对绝大多数多步任务，又能在 LLM 进入死循环时及时阻断
#   常见场景：Read 多文件 + Edit 多处 = 5-10 轮；批量重构 = 10-15 轮
#   调到 50 用于长任务（如迁移整个模块），调到 10 用于受限场景
#
# enable_system_reminders：v0.4 — 是否在每轮 LLM 调用前注入 <system-reminder> 块
#   默认 true。设为 false 可以完全关闭 env / plan_mode 提醒注入，便于调试。
#
# plan_reminder_interval：v0.4 — plan mode 提醒的复读周期（按迭代轮次计）
#   默认 5 — 在第 1、6、11、16 ... 轮重发 plan_mode 提醒
#   改小（比如 3）让 agent 在长任务里更频繁地收到提醒；改大减少噪音
#
# rules：v0.4 — 7 条关键规则的总开关。任一字段设为 false 时,
#   - 该规则不会出现在 system prompt 的「工具使用关键规则」section
#   - 也不会注入相关工具的 description 前缀
#   适合某条规则不适用于当前项目场景时单独关掉。
#
# agent:
#   max_iterations: 20
#   enable_system_reminders: true
#   plan_reminder_interval: 5
#   rules:
#     edit_requires_read: true           # Edit/Write 前必先 Read
#     prefer_specialized_tools: true     # 优先 Read/Grep/Glob 而非 Bash 模拟
#     bash_timeout: true                 # Bash 必传 timeout 参数
#     parallel_limit: true               # 单次并行无副作用工具不超过 4 个
#     error_then_decide: true            # is_error 后先分析再行动
#     absolute_paths: true               # 所有路径必为绝对路径
#     webfetch_to_file: true             # WebFetch 大内容落临时文件再用 Read
#     # 例:关掉 webfetch_to_file,因为本项目不联网
#     # webfetch_to_file: false
#
# denial_warn_threshold：v0.5 — 同一工具连续拒绝次数 ≥ 此值时,向 LLM 注入
#   `<system-reminder type="denial_rate_limit">` 提醒它调整策略(不终止 loop)
#   默认 5。调到 3 更敏感,调到 10 更宽容。

# 五层防御权限系统（v0.5 新增；整个块可省略，省略时全部走 default mode + 无规则）
#
# 设计：
# - mode 三档:strict(默认拒)/ default(弹 Modal)/ permissive(默认过)
# - rules 静态规则(glob 匹配,支持 fnmatch 的 * / ? / [seq])
# - L1 硬黑名单(r'rm -rf /' 等)无法被配置覆盖,任何 mode 都拦
# - L2 沙箱把文件操作锁在 project_root 内,做 symlink 解析防逃逸
# - 规则可放本 config / 项目级 .baozicode/permissions.yaml / 用户级
#   ~/.config/baozicode/permissions.yaml / 项目级 .baozicode/permissions.local.yaml
# - 也可拆成 sidecar 文件:与 config.yaml 同目录的 permissions*.yaml 会被自动合并
#
# 完整优先级(deny-veto):
#   session(运行时 add) > local(项目,不入 git) > project(项目) > user_global(~/.config)
#
# permissions_v5:
#   mode: default
#   rules:
#     # 放行 git / npm test(只读/测试,无副作用)
#     - tool: Bash
#       pattern: "git *"
#       decision: allow
#     - tool: Bash
#       pattern: "npm test *"
#       decision: allow
#     - tool: Bash
#       pattern: "pytest *"
#       decision: allow
#     # 拒危险操作(L1 黑名单已拦,这里再加一层防御)
#     - tool: Bash
#       pattern: "rm *"
#       decision: deny
#     - tool: Bash
#       pattern: "sudo *"
#       decision: deny
#     # 拒写 .env / 凭证文件
#     - tool: Read
#       pattern: "*.env"
#       decision: deny
#     - tool: Write
#       pattern: "*.env"
#       decision: deny
#     - tool: Edit
#       pattern: "*.env"
#       decision: deny

# 上下文压缩配置（v0.7 新增；整个块可省略，省略时走 default）
#
# 两层压缩策略:
# - Layer 1(预防):单条 ToolResultBlock > per_block_threshold(默认 8KB)
#   或同 message 内 tool results 合计 > per_message_threshold(默认 20KB)
#   时,把内容存盘,对话里只留 preview + 文件路径,避免单条消息撑爆。
# - Layer 2(兜底):整体对话逼近窗口上限(> context_window - reserve_tokens)
#   时调 LLM 生成 6 段结构化摘要,把较早消息摘要掉、近期原文保留。
#   摘要 prompt 明确禁止调工具,先写 ANALYSIS 草稿再写 SUMMARY 正式段;
#   压缩后追加 post_compaction_reminder 边界消息提醒重新读取文件。
#
# 触发时机:
# - auto: 每次 LLM 请求前自动跑,余量 13K 防估算误差
# - manual: 用户在 TUI 输入 /compact,余量 3K(用户主动要压,余量收紧)
#
# 摘要连续失败 max_consecutive_failures 次(默认 3) → 熔断,Agent loop
# 走 StopReason.COMPACTION_FAILED,避免死循环。
#
# agent:
#   context_window_tokens: 128000          # 全局上下文窗口(BackendConfig 里的同名
#                                            # 字段优先,这里作为 fallback)。gt=0 校验。
#   compaction:
#     per_block_threshold: 8192            # 单条 ToolResultBlock 字节阈值(gt=0)
#     per_message_threshold: 20480         # 同 message 内 tool results 字节合计阈值
#     recent_window_min_messages: 5        # Layer 2 tail 至少留多少条原文(ge=1)
#     recent_window_tokens: 10000          # Layer 2 tail 至少留多少 tokens(ge=1)
#     reserve_tokens_auto: 13000           # auto 触发的安全余量(ge=0)
#     reserve_tokens_manual: 3000          # manual 触发的安全余量(ge=0)
#     max_summary_tokens: 2000             # LLM 摘要输出上限(ge=100)
#     max_consecutive_failures: 3          # Layer 2 熔断阈值(ge=1)
#
# 关掉压缩(回到 v0.6 行为,Layer 1 + Layer 2 都不跑):
# agent:
#   context_window_tokens: 0  # 0 会被 Pydantic 拒绝,所以最小是 1
#                              # 想关掉建议直接在 CLI 不传 --enable-compact
#
# time_gap_threshold_hours：v0.8 — /resume 加载历史 session 时,若距上次消息
#   超过这个小时数,插入一条 <system-reminder type="time_gap"> 提醒 LLM
#   上下文可能已变(默认 8 小时,gt=0)。调到 0 等同不插。

# MCP 外部 server 配置（v0.6 新增；整个块可省略，省略时不启动 MCP）
#
# 两层配置合并：用户级 ~/.config/baozicode/config.yaml 和项目级 config.yaml
# 都可声明 mcp_servers，项目级按 server 名覆盖用户级。
# command / args / env / url / headers 内的 ${VAR} 占位符在合并后展开。
#
# 两种传输:
# - type: stdio — 本地子进程走 stdin/stdout 管道
# - type: http  — 远程走 Streamable HTTP POST
#
# 超时字段(全部可选,单位秒):
# - init_timeout_s: 5          # initialize 单步超时
# - tools_list_timeout_s: 8    # tools/list 单步超时
# - startup_total_timeout_s: 15 # 整段握手超时(per server)
# - call_timeout_s: 60         # 单次 tools/call 超时
#
# mcp_servers:
#   # stdio 例子:本地文件系统 MCP server
#   fs:
#     type: stdio
#     command: python
#     args: ["-m", "mcp_server_filesystem", "/tmp/root"]
#     env:
#       MCP_LOG_LEVEL: DEBUG
#
#   # http 例子:远程 MCP server
#   remote:
#     type: http
#     url: https://mcp.example.com/v1
#     headers:
#       Authorization: "Bearer ${REMOTE_MCP_TOKEN}"

# Skill 系统配置(v1.0 新增;整个块可省略,省略时走全部默认)
#
# Skill = 可复用 AI 操作的 Markdown 文件 + YAML frontmatter。Agent 启动时只看
# 名字 + 一句话说明,要用时调 load_skill 工具按需加载完整 SOP,激活后正文会
# 钉在每轮对话 env 上下文顶部。
#
# 字段:
# - enabled:是否启用 Skill 系统;设 false → 不扫描任何目录,prompt section
#   也不出现「可用 Skill」段(默认 true)
# - builtin_dir:内置 Skill 目录;默认 <pkg>/skills/builtin(始终有内容)
# - user_dir:用户级 Skill 目录;默认 ~/.config/baozicode/skills
# - project_dir:项目级 Skill 目录;默认 <project_root>/.baozicode/skills
#   三级优先级:project > user > builtin,同名 Skill 高优先级覆盖低优先级。
# - summary_model:v1.1 计划 — 独立模式 Skill 摘要时用的模型;省略走主后端
# - history_bubbles_default:v1.1 计划 — 独立模式默认带几条历史气泡;默认 0
#
# 不想用 Skill 系统(退回 v0.9 行为):enabled: false
# skills:
#   enabled: true
#   # 想把 Skill 集中放别处:
#   # builtin_dir: /opt/baozicode/skills
#   # user_dir: ~/my-skills
#   # project_dir: ./team-skills
#
# Skill 文件格式示例(写在 <上述任一目录>/<skill-name>/SKILL.md):
# ---
# name: commit
# description: 根据当前 git diff 生成符合 conventional commits 的 commit message
# mode: shared
# allowed-tools: [Bash, Read]
# ---
# 根据当前 `git diff --staged` 生成一个符合 conventional commits 规范的 commit
# message,并自动 `git commit -m "<message>"`。
# ## SOP
# 1. 调 Bash 跑 `git diff --staged --stat` 看改动概览
# 2. 调 Bash 跑 `git diff --staged` 看完整 diff
# 3. 归纳改动 → 生成 commit message
# 4. 调 Bash 跑 `git commit -m "<subject>"`
#
# frontmatter 字段(name / description / mode / allowed-tools / history-bubbles
# / model)见 docs/migrations/v0.9-to-v1.0.md 完整说明。

# ============================================================================
# v1.1 Hooks Lifecycle — 自动化规则
# ============================================================================
# 想用 Hook 系统配置一次"事件 → 条件 → 动作"链,Agent 在关键时机自动跑。
# 不写 `hooks:` 块 = 整个系统关闭,行为完全等价于 v1.0。
#
# 一条 hook 的形状:
#   id: 唯一标识(同一 config.yaml 内不重复)
#   event: 触发时机(session.start / session.end / turn.start / turn.end /
#          message.received / message.sent / tool.pre / tool.post /
#          system.error / system.compaction / system.cancel)
#   if: 可选条件,all 或 any 二选一
#   actions: 一组动作(顺序执行,任一拒则停)— 4 种 action 类型:
#     - shell:跑 bash,exit_code ≠ 0 视为 deny;不允许配 deny 字段
#     - http:发 HTTP,parse_expr 用 simpleeval 决定 deny
#     - prompt:注入文字到 system prompt,slot 决定位置
#     - sub-agent:启动子 Agent(v1.1 占位,v1.2 实现真子 Agent)
#   async: true 仅允许在 tool.post 用;其他 event 配 async 会启动期报错
#   timeout_seconds: 30(默认);1 ≤ x ≤ 300
#   run_once: false(默认);true 则该 hook 触发一次后停用
#
# 失败策略:hook 抛异常 / 超时 / 配置错 → 只 log.warning,绝不打断 Agent 主流程
# 硬墙:L1 硬黑名单(rm -rf / / sudo / chmod 777 等)永远先于 hook.pre 跑,
# hook.allow 不可绕过 L1。
#
hooks:
  - id: audit-bash-pre
    event: tool.pre
    if:
      all:
        - tool: "Bash"
    actions:
      - action: shell
        command: |
          echo "$(date -Iseconds) tool.pre Bash $ARG_COMMAND" \
            >> .baozicode/audit.log
        timeout_seconds: 5
    # exit_code == 0 → 放行;非 0 → deny(stdout 第一行作为 reason)

  - id: inject-style
    event: turn.start
    # 无条件触发,每轮 turn 开头注入"代码风格"提醒
    actions:
      - action: prompt
        content: |
          本项目代码风格:PEP 8 + 100 字符行宽 + 类型注解必须
          仅当轮可见,不持久化
        slot: temp

  - id: audit-bash-post-async
    event: tool.post
    async: true
    if:
      all:
        - tool: "Bash"
    actions:
      - action: shell
        command: |
          # 后台跑审计写入,不灌入下一轮 LLM 上下文
          echo "$(date -Iseconds) tool.post Bash $ARG_COMMAND exit=$?" \
            >> .baozicode/audit.log
        timeout_seconds: 5
        enqueue: false  # 默认,后台日志只写文件,不 enqueue_reminder

  # v1.2 control action 示例:turn.start 时清空上一轮累积的 sticky reminder
  # 语义独立 — 只清 _pending_reminders,_hook_stable_overrides / _temp_reminders 不动
  - id: reset-sticky-each-turn
    event: turn.start
    actions:
      - action: clear_sticky_reminders

  # v1.2 control action 示例:turn.end 时清空本轮注入到 stable_system 的 override 段
  # 语义独立 — 只清 _hook_stable_overrides,_pending_reminders / _temp_reminders 不动
  - id: clear-overrides-each-turn
    event: turn.end
    actions:
      - action: clear_stable_system_overrides

  # v1.2 system.compaction fire:压缩前先写一行"压缩前快照"日志
  # payload 通过 env var $EVENT_ARG_0 (trigger) / $EVENT_ARG_1 (tokens_before) 暴露
  - id: log-pre-compaction
    event: system.compaction
    actions:
      - action: shell
        command: |
          echo "[$(date -Iseconds)] compaction trigger=$EVENT_ARG_0 tokens_before=$EVENT_ARG_1" \
            >> .baozicode/compaction.log
        timeout_seconds: 5

  # v1.2 system.cancel fire:用户取消时调 HTTP 通知外部系统
  # payload 是 dict {reason: "user_cancelled", iteration: int}
  # v1.2 起 dict payload 的命名键通过 $EVENT_<KEY> 大写 env var 暴露
  - id: notify-cancel
    event: system.cancel
    actions:
      - action: http
        url: http://audit.example/cancel
        method: POST
        body:
          reason: "$EVENT_REASON"
          iteration: "$EVENT_ITERATION"
        parse_expr: 'res.deny = res.status == 500'

# ─────────────────────────────────────────────────────────────────────
# v1.2 subagents — 主 Agent 派 sub-Agent 的配置
# 不写本块则走默认:enabled=true, max_concurrent=5, 其它全部默认
# ─────────────────────────────────────────────────────────────────────
subagents:
  enabled: true
  max_concurrent: 5
  default_timeout_seconds: 300
  task_retention_minutes: 5
  plugins_enabled: true
  background_whitelist:
    - Read
    - Grep
    - Glob
    - WebFetch
    - notify_complete

  # builtin_dir / user_dir / project_dir 留 None 时走默认:
  # builtin_dir  = <pkg>/baozicode/agents/builtin
  # user_dir     = ~/.config/baozicode/agents
  # project_dir  = <project>/.baozicode/agents
  # builtin_dir: null
  # user_dir: null
  # project_dir: null

  # ───────────────────────────────────────────────────────────────────
  # v1.3 worktree — 子 Agent isolation: worktree 隔离配置
  # 不写本块 → worktree 系统不启用(isolation: worktree 角色 spawn 报错)
