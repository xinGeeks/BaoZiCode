[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "baozicode"
version = "1.2.0"
description = "BaoZiCode - 一个用 Python 开发的命令行 AI 编码助手"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "BaoZiCode Authors" }]
dependencies = [
    "textual>=8.0,<9.0",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# ripgrep 可选 — Grep 工具会自动 fallback 到 Python re。
# 用户系统装好 `rg` 命令即可，无需 pip。
rg = []
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
]

[project.scripts]
baozicode = "baozicode.cli:main"


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]


[tool.hatch.build.targets.wheel]
packages = ["baozicode"]

[tool.hatch.build.targets.wheel.force-include]
"config.example.yaml" = "baozicode/config.example.yaml"
".env.example" = "baozicode/.env.example"